<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>带图片测试网页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f0f4f8;
            font-family: "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .box {
            background: white;
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000022;
            text-align: center;
            max-width: 550px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            font-size: 18px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🎉 网页部署成功！</h1>
        <!-- 这里是网络示例图片，可替换 -->
        < img src="https://picsum.photos/id/237/500/300" alt="示例图片">
        <p>这是 GitHub Pages 带图片的测试页面</p >
        <p>公网访问正常就会看到图片</p >
    </div>
</body>
</html>
